services:
  lb:
    image: haproxy:3.0-alpine
    container_name: rinha-lb
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    depends_on:
      - api1
      - api2
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "16MB"

  api1:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: rinha-api1
    environment:
      - SOCKET_PATH=/sockets/api1.sock
      - INDEX_PATH=/app/index.bin
    volumes:
      - sockets:/sockets
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: rinha-api2
    environment:
      - SOCKET_PATH=/sockets/api2.sock
      - INDEX_PATH=/app/index.bin
    volumes:
      - sockets:/sockets
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  rinha-net:
    driver: bridge

volumes:
  sockets:
